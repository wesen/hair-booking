      viewport: desktop
      fixtures:
        scenario: rowActions
      asserts:
      - ActionGroup renders the RowActions scenario without layout breakage.
      - The relevant semantic state is visible to users and test selectors.
    BulkToolbarActions:
      doc: Tests the BulkToolbarActions scenario for ActionGroup with representative fixtures and assertions.
      viewport: desktop
