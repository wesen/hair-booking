  file_layout: organisms/ResourceTable/parts/BulkActionBar.tsx
  human_notes:
    intent: Owns the selected/visible-row action strip and visual hierarchy for table-level operations.
    adapter_boundary: ResourceTable computes selected/visible context and passes it down; BulkActionBar only renders and invokes
      bulk callbacks.
    slot_intent:
      bulkToolbar: Bulk toolbar actions are table-selection actions, not page or row actions.
    storybook_intent: Stories should cover selected vs visible scope, disabled no-selection state, primary and danger actions.
