- id: admin.data-display.comparison-table
  name: ComparisonTable
  status: promoted
  classification:
    level: organism
    description: ComparisonTable participates in the Admin DSL component system as a organism; its level controls scaffold
      location and Storybook grouping.
  source_mapping:
    current_constructs:
    - case "comparisonTable"
    current_files:
