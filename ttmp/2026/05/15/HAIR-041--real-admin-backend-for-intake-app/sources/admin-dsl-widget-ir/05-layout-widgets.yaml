widgets:
- name: PageHeader
  current_source: case "pageHeader" in renderAdminNode
  classification:
    level: organism
  props: |-
    export interface PageHeaderProps extends CommonWidgetProps {
      breadcrumbs?: string[];
      title: string;
      description?: string;
      primaryActions?: ActionViewModel[];
      onPrimaryAction?: PageActionHandler;
    }
  action_slots:
  - name: primaryActions
    context: page
    callback_prop: onPrimaryAction
    intent: Page actions should be few and high-level. They should not receive row/form context.
    implementation_note: The widget emits typed context through the callback; the Admin DSL adapter lowers it to dispatchAdminAction
      or backend action transport.
  usage_example: |-
    <PageHeader
      breadcrumbs={["Admin DSL", "Workbench v2"]}
      title="Request Triage"
      description="Review customer intake requests."
      primaryActions={[newServiceAction]}
      onPrimaryAction={handlePageAction}
    />
  storybook_stories:
  - Default
  - WithBreadcrumbs
  - WithPrimaryAction
  - LongTitleMobile
  - NoDescription
  file_layout: |-
    web/src/admin-dsl/widgets/organisms/PageHeader/
      PageHeader.tsx
      PageHeader.types.ts
      PageHeader.stories.tsx
      PageHeader.test.tsx
      index.ts
  human_notes:
    intent: Owns page-level title hierarchy, breadcrumbs, description, and primary page actions. It should make the top-of-page
      layout reusable across workbench screens.
    adapter_boundary: Adapter maps pageHeader props/actions into typed props; widget receives strings and ActionViewModel
      values only.
    slot_intent:
      primaryActions: Page actions should be few and high-level. They should not receive row/form context.
    storybook_intent: Stories should cover long responsive titles, breadcrumbs, descriptions, and primary action alignment.
  xxx:
  - Replace generated scaffold placeholder with final implementation.
  - Keep raw Admin DSL JSON parsing in adapters, not in this widget.
- name: DashboardGrid
  current_source: case "dashboardGrid" and layoutSpan/layoutOrder helpers
  classification:
