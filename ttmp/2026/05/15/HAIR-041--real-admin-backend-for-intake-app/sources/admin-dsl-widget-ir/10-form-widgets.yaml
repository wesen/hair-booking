widgets:
- id: admin.form.admin-form
  name: AdminForm
  status: scaffolded
  classification:
    level: organism
    description: AdminForm participates in the Admin DSL component system as a organism; its level controls scaffold location
      and Storybook grouping.
  source_mapping:
    current_constructs:
    - case "form"
    current_files:
    - path: web/src/admin-dsl/render.tsx
      notes: Current renderer source to inspect for this construct.
  intent:
    purpose: AdminForm widget.
    design_rationale: AdminForm extracts a named React boundary from the old Admin DSL renderer so behavior, stories, styling,
      and action context can be reviewed independently.
    adapter_boundary: The Admin DSL adapter should convert raw node props/actions into typed AdminForm props. AdminForm should
      not parse AdminNode JSON or call backend dispatch helpers directly.
    implementation_notes:
    - Implement AdminForm using design tokens and typed props from this IR.
    - Keep transport/adapter compatibility outside the visual component.
    accessibility_notes:
    - Ensure AdminForm exposes semantic roles, labels, focus behavior, and keyboard interaction appropriate to its rendered
      controls.
  contract:
    props:
      AdminFormProps:
        doc: Props for AdminForm. These are normalized widget props produced by adapters or callers, not raw Admin DSL JSON.
        fields:
          formId:
            type: string
            required: true
            doc: 'formId configures admin form. Type: string.'
          title:
            type: string
            required: false
            doc: Primary heading or title rendered by AdminForm.
          dirty:
            type: boolean
            required: false
            doc: Whether AdminForm should show unsaved-change state.
          pending:
            type: boolean
            required: false
            doc: Whether AdminForm should show in-progress state.
          state:
            type: '"idle" | "dirty" | "pending" | "success" | "error"'
            required: false
            doc: Lifecycle state rendered by AdminForm.
          errors:
            type: Record<string, string>
            required: false
            doc: Validation errors rendered by AdminForm.
          actions:
            type: ActionViewModel[]
            required: false
            doc: Ordered action list for the AdminForm slot. Presentation should be derived from semantic slot and action
              intent.
          children:
            type: React.ReactNode
            required: true
            doc: Already-rendered child content owned by the caller/adapter and placed inside AdminForm.
          onFormAction:
            type: FormActionHandler<Values>
            required: false
            doc: 'onFormAction configures admin form. Type: FormActionHandler<Values>.'
        extends: <Values = Record<string, unknown>>  CommonWidgetProps
    action_slots:
      submit:
        doc: submit action slot for AdminForm. The widget emits the declared context through onAction and adapters lower it
          to runtime dispatch.
        callback: onAction
        action_type: ActionViewModel
        cardinality: many
        context_type: SubmitContext
        context:
          value:
            type: unknown
            required: false
            doc: Optional contextual payload for the submit slot on AdminForm.
        lowering:
          adapter: dispatchAdminAction
          note: Adapter lowers this typed callback into Admin DSL dispatch.
      cancel:
        doc: cancel action slot for AdminForm. The widget emits the declared context through onAction and adapters lower it
          to runtime dispatch.
        callback: onAction
        action_type: ActionViewModel
        cardinality: many
        context_type: CancelContext
        context:
          value:
            type: unknown
            required: false
            doc: Optional contextual payload for the cancel slot on AdminForm.
        lowering:
          adapter: dispatchAdminAction
          note: Adapter lowers this typed callback into Admin DSL dispatch.
      formFooter:
        doc: formFooter action slot for AdminForm. The widget emits the declared context through onAction and adapters lower
          it to runtime dispatch.
        callback: onAction
        action_type: ActionViewModel
        cardinality: many
        context_type: FormfooterContext
        context:
          value:
            type: unknown
            required: false
            doc: Optional contextual payload for the formFooter slot on AdminForm.
        lowering:
          adapter: dispatchAdminAction
          note: Adapter lowers this typed callback into Admin DSL dispatch.
  examples:
    DefaultUsage:
      doc: Demonstrates the intended normalized usage of AdminForm after adapter lowering.
      demonstrates:
      - Normalized props for AdminForm.
      - Adapter boundary expectations.
      code: "<AdminForm\n  formId=\"serviceForm\"\n  title=\"Highlights\"\n  dirty\n  actions={[saveAction, cancelAction]}\n\
        \  onFormAction={(action, context) => submit(action, context.values)}\n>\n  <FieldGroup title=\"Identity\">\n    <TextField\
        \ name=\"label\" label=\"Label\" value=\"Highlights\" />\n  </FieldGroup>\n</AdminForm>"
  stories:
    Default:
      doc: Tests the baseline AdminForm rendering with representative production-like data.
      viewport: desktop
      fixtures:
        scenario: default
      asserts:
      - AdminForm renders the Default scenario without layout breakage.
      - The relevant semantic state is visible to users and test selectors.
    DirtyState:
      doc: Tests dirty/unsaved lifecycle state in AdminForm.
      viewport: desktop
      fixtures:
        scenario: dirtyState
      asserts:
      - AdminForm renders the DirtyState scenario without layout breakage.
      - The relevant semantic state is visible to users and test selectors.
    PendingState:
      doc: Tests pending/saving lifecycle state in AdminForm.
      viewport: desktop
      fixtures:
        scenario: pendingState
      asserts:
      - AdminForm renders the PendingState scenario without layout breakage.
      - The relevant semantic state is visible to users and test selectors.
    SuccessState:
      doc: Tests saved/success lifecycle state in AdminForm.
      viewport: desktop
      fixtures:
        scenario: successState
      asserts:
      - AdminForm renders the SuccessState scenario without layout breakage.
      - The relevant semantic state is visible to users and test selectors.
    WithErrors:
      doc: Tests validation error summary rendering in AdminForm.
      viewport: desktop
      fixtures:
        scenario: withErrors
      asserts:
      - AdminForm renders the WithErrors scenario without layout breakage.
      - The relevant semantic state is visible to users and test selectors.
    SubmitActions:
      doc: Tests submit/cancel action slots and form value context in AdminForm.
      viewport: desktop
      fixtures:
        scenario: submitActions
      asserts:
      - AdminForm renders the SubmitActions scenario without layout breakage.
      - The relevant semantic state is visible to users and test selectors.
    NestedFieldGroups:
      doc: Tests nested field group composition inside AdminForm.
      viewport: desktop
      fixtures:
        scenario: nestedFieldGroups
      asserts:
      - AdminForm renders the NestedFieldGroups scenario without layout breakage.
      - The relevant semantic state is visible to users and test selectors.
  outputs:
    component:
      path: web/src/admin-dsl/widgets/organisms/AdminForm/AdminForm.tsx
    types:
      path: web/src/admin-dsl/widgets/organisms/AdminForm/AdminForm.types.ts
    stories:
      path: web/src/admin-dsl/widgets/organisms/AdminForm/AdminForm.stories.tsx
    barrel:
      path: web/src/admin-dsl/widgets/organisms/AdminForm/index.ts
    tests:
      path: web/src/admin-dsl/widgets/organisms/AdminForm/AdminForm.test.tsx
  implementation_todos:
  - id: replace-generated-scaffold-placeholder-with-final-implementation
    severity: required
    doc: Replace generated scaffold placeholder with final implementation.
