- id: admin.layout.panel
  name: Panel
  status: scaffolded
  classification:
    level: organism
    description: Panel participates in the Admin DSL component system as a organism; its level controls scaffold location
      and Storybook grouping.
  source_mapping:
    current_constructs:
    - case "panel" in renderAdminNode
    current_files:
    - path: web/src/admin-dsl/render.tsx
      notes: Current renderer source to inspect for this construct.
  intent:
    purpose: Central admin surface primitive for dense workbench content. It owns header/body/footer chrome, padding, density,
      and action placement.
    design_rationale: Central admin surface primitive for dense workbench content. It owns header/body/footer chrome, padding,
      density, and action placement.
    adapter_boundary: Adapter maps toolbarActions/footerActions and renders children separately; widget receives typed React
      children and action arrays.
    implementation_notes:
    - Implement Panel using design tokens and typed props from this IR.
    - Keep transport/adapter compatibility outside the visual component.
    accessibility_notes:
    - Ensure Panel exposes semantic roles, labels, focus behavior, and keyboard interaction appropriate to its rendered controls.
  contract:
    props:
      PanelProps:
        doc: Props for Panel. These are normalized widget props produced by adapters or callers, not raw Admin DSL JSON.
        fields:
          title:
            type: string
            required: false
            doc: Primary heading or title rendered by Panel.
          subtitle:
            type: string
            required: false
            doc: Optional secondary heading text rendered by Panel.
          eyebrow:
            type: string
            required: false
            doc: Optional compact contextual label rendered above the main title in Panel.
          body:
            type: string
            required: false
            doc: Optional body copy rendered by Panel.
          padding:
            type: '"none" | "normal"'
            required: false
            doc: Padding policy for Panel; dense table panels often use none.
          density:
            type: '"compact" | "normal" | "spacious"'
            required: false
            doc: Density policy for Panel spacing and chrome. Compact panels reduce header/body/footer padding for dense admin tables; spacious panels increase breathing room for summary or review surfaces.
          toolbarActions:
            type: ActionViewModel[]
            required: false
            doc: Panel-local actions rendered in the header area of Panel.
          footerActions:
            type: ActionViewModel[]
            required: false
            doc: Panel-local actions rendered in the footer area of Panel.
          children:
            type: React.ReactNode
            required: false
            doc: Already-rendered child content owned by the caller/adapter and placed inside Panel.
          onToolbarAction:
            type: PanelActionHandler
