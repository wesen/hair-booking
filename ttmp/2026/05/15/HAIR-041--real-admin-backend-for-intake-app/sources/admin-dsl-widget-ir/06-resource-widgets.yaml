      asserts:
      - ResourceTable renders the Pagination scenario without layout breakage.
      - The relevant semantic state is visible to users and test selectors.
    StatusBadgeCells:
      doc: Tests mapped status cell rendering in ResourceTable.
      viewport: desktop
