<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Fringe Intake — 09 Confirm</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Anton&family=Oswald:wght@400;600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
  html, body { margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; background: #f6efe4; color: #111; min-height: 100%; }
  * { box-sizing: border-box; }
  button { font-family: inherit; }
  #root { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .phone-scroll::-webkit-scrollbar { width: 0; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script type="text/babel" src="../design-system.jsx"></script>
<script type="text/babel" src="../intake-fs.jsx"></script>

<script type="text/babel">
  const { FS } = window;
  const Screen = window.S_Confirm;

  function Phone({ children }) {
    return (
      <div data-screen-label="09 · Confirm" style={{
        width: 390,
        height: 844,
        borderRadius: 48,
        background: FS.color.paper,
        border: `8px solid #1a1a1a`,
        overflow: 'hidden',
        boxShadow: '0 24px 60px rgba(17,17,17,0.18)',
        position: 'relative',
      }}>
        <div className="phone-scroll" style={{ width: '100%', height: '100%', overflow: 'hidden' }}>
          {children}
        </div>
      </div>
    );
  }

  function App() {
    return <Phone><Screen /></Phone>;
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
