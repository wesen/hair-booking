    adapter_boundary: Adapter converts node child layout metadata into DashboardGridItem props; the widget should not inspect
      AdminNode.meta.
    storybook_intent: Stories should prove 12-column layout, compact/spacious gaps, mixed spans, mobile single-column layout,
