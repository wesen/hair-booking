            doc: 'Context described in v1 IR as: panel'
        lowering:
          adapter: dispatchAdminAction
          note: The widget emits typed context through the callback; the Admin DSL adapter lowers it to dispatchAdminAction
            or backend action transport.
      footerActions:
        doc: Footer actions are local to the panel result/flow and should preserve panel context.
        callback: onFooterAction
        action_type: ActionViewModel
        cardinality: many
        context_type: FooteractionsContext
        context:
          value:
            type: unknown
            required: false
            doc: 'Context described in v1 IR as: panel'
