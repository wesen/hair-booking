# Fringe Intake Screens — Prototype vs React Implementation Comparison
#
# Left side: standalone HTML prototypes served by gallery server (port 7071)
# Right side: Storybook iframe stories served by Storybook (port 6006)
#
# Usage:
#   css-visual-diff verbs --repository design-galley/visual-diff/userland/verbs \
#     fringe review from-spec --specFile design-galley/visual-diff/userland/specs/fringe-intake.yaml \
#     --outDir /tmp/fringe-review
#
#   css-visual-diff serve --data-dir /tmp/fringe-review --port 18098 --open

name: fringe-intake
variant: mobile

viewport:
  width: 500
  height: 920

defaults:
  waitMs: 3000
  threshold: 30

policy:
  bands:
    - name: accepted
      maxChangedPercent: 0.5
    - name: review
      maxChangedPercent: 10
    - name: tune-required
      maxChangedPercent: 30
    - name: major-mismatch
      maxChangedPercent: 100

computed:
  - display
  - position
  - width
  - height
  - margin-top
  - margin-right
  - margin-bottom
  - margin-left
  - padding-top
  - padding-right
  - padding-bottom
  - padding-left
  - font-family
  - font-size
  - font-weight
  - line-height
  - letter-spacing
  - text-transform
  - color
  - background-color
  - border-radius
  - border-left
  - box-shadow
  - overflow

attributes:
  - data-component
  - data-page
  - class

pages:
  service:
    leftUrl: http://localhost:7071/standalone/mobile/01-service.html
    rightUrl: http://localhost:6006/iframe.html?id=pages-servicepage--default&viewMode=story
    sections:
      screen:
        leftSelector: '[data-page="service"]'
        rightSelector: '[data-component="StoryPhoneFrame"]'

  color:
    leftUrl: http://localhost:7071/standalone/mobile/02-color.html
    rightUrl: http://localhost:6006/iframe.html?id=pages-colorpage--default&viewMode=story
