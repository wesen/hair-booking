      order?: number;
      children: React.ReactNode;
    }
  action_slots: []
  storybook_stories:
  - TwelveColumnDesktop
  - CompactGap
  - MixedSpanCards
  - MobileSingleColumn
  - Ordering
  file_layout: |-
    web/src/admin-dsl/widgets/organisms/DashboardGrid/
      DashboardGrid.tsx
      DashboardGrid.types.ts
      DashboardGrid.stories.tsx
      index.ts
  human_notes:
    intent: Owns responsive dashboard grid layout and item span/order behavior instead of scattering grid styles across Admin
