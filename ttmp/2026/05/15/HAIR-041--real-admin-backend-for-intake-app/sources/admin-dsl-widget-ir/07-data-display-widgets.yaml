      notes: Current renderer source to inspect for this construct.
  intent:
    purpose: ComparisonTable widget.
    design_rationale: ComparisonTable extracts a named React boundary from the old Admin DSL renderer so behavior, stories,
      styling, and action context can be reviewed independently.
    adapter_boundary: The Admin DSL adapter should convert raw node props/actions into typed ComparisonTable props. ComparisonTable
      should not parse AdminNode JSON or call backend dispatch helpers directly.
    implementation_notes:
    - Implement ComparisonTable using design tokens and typed props from this IR.
    - Keep transport/adapter compatibility outside the visual component.
    accessibility_notes:
    - Ensure ComparisonTable exposes semantic roles, labels, focus behavior, and keyboard interaction appropriate to its rendered
      controls.
  contract:
    props:
      ComparisonTableRow:
        doc: Props for ComparisonTable. These are normalized widget props produced by adapters or callers, not raw Admin DSL
          JSON.
        fields:
          id:
            type: string
            required: false
            doc: Stable DOM/data id for the ComparisonTable instance.
          field:
            type: string
            required: true
            doc: 'field configures comparison table. Type: string.'
          current:
            type: string
            required: false
            doc: 'current configures comparison table. Type: string.'
          draft:
            type: string
            required: false
            doc: 'draft configures comparison table. Type: string.'
          scheduled:
            type: string
            required: false
            doc: 'scheduled configures comparison table. Type: string.'
          actions:
            type: ActionViewModel[]
            required: false
            doc: Ordered action list for the ComparisonTable slot. Presentation should be derived from semantic slot and action
              intent.
      ComparisonTableProps:
        doc: Props for ComparisonTable. These are normalized widget props produced by adapters or callers, not raw Admin DSL
          JSON.
        fields:
          tableId:
            type: string
            required: true
            doc: Stable table id used by ComparisonTable for selection state, action context, and test hooks.
          rows:
            type: ComparisonTableRow[]
            required: true
            doc: Row data rendered by ComparisonTable. Row-specific actions receive entries from this collection as context.
          empty:
            type: React.ReactNode
            required: false
            doc: 'empty configures comparison table. Type: React.ReactNode.'
          onRowAction:
            type: '(action: ActionViewModel, context: { tableId: string; row: ComparisonTableRow }) => void'
            required: false
            doc: Callback invoked by ComparisonTable with table id, row, and optional row id.
        extends: CommonWidgetProps
    action_slots:
      rowActions:
        doc: rowActions action slot for ComparisonTable. The widget emits the declared context through onAction and adapters
          lower it to runtime dispatch.
        callback: onAction
        action_type: ActionViewModel
        cardinality: many
        context_type: RowactionsContext
        context:
          value:
            type: unknown
            required: false
            doc: 'Context described in v1 IR as: { tableId, row }'
        lowering:
          adapter: dispatchAdminAction
          note: Adapter lowers this typed callback into Admin DSL dispatch.
  examples:
    BasicUsage:
      doc: Demonstrates the normalized props expected by ComparisonTable. Use this as a scaffold for real stories and implementation
        tests.
      demonstrates:
      - Typed ComparisonTable props after adapter lowering.
      - Widget-level usage without raw Admin DSL parsing.
