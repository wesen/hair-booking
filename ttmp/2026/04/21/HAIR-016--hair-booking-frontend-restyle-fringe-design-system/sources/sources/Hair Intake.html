<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Fringe — Hair Intake</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Anton&family=Oswald:wght@400;600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
  html, body { margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; background: #f6efe4; color: #111; height: 100%; }
  #root { height: 100vh; }
  * { box-sizing: border-box; }
  button { font-family: inherit; }
  /* Hide scrollbar inside phone content for cleanliness */
  .phone-scroll::-webkit-scrollbar { width: 0; }
</style>
</head>
<body>

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-system.jsx"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="intake-fs.jsx"></script>
<script type="text/babel" src="intake-desktop.jsx"></script>

<script type="text/babel">
  const { useState } = React;
  const { FS } = window;

  const SCREENS = [
    { id: 's1', label: '01 · Service',    Comp: window.S_Service },
    { id: 's2', label: '02 · Color',      Comp: window.S_Color },
    { id: 's3', label: '03 · Length',     Comp: window.S_Extensions },
    { id: 's4', label: '04 · Photos',     Comp: window.S_Photos },
    { id: 's5', label: '05 · History',    Comp: window.S_History },
    { id: 's6', label: '06 · Budget',     Comp: window.S_Budget },
    { id: 's7', label: '07 · Estimate',   Comp: window.S_Estimate },
    { id: 's8', label: '08 · Booking',    Comp: window.S_Booking },
    { id: 's9', label: '09 · Confirm',    Comp: window.S_Confirm },
  ];

  function Phone({ children }) {
    return (
      <div data-screen-label={arguments[0]?.label} style={{
        width: 390, height: 844, borderRadius: 48,
        background: FS.color.paper,
        border: `8px solid #1a1a1a`,
        overflow: 'hidden',
        boxShadow: '0 24px 60px rgba(17,17,17,0.18)',
        position: 'relative',
      }}>
        <div className="phone-scroll" style={{ width: '100%', height: '100%', overflow: 'hidden' }}>
          {children}
        </div>
      </div>
    );
  }

  function App() {
    const { DesignCanvas, DCSection, DCArtboard } = window;
    return (
      <DesignCanvas title="Fringe — Hair Intake" subtitle="9-step flow · built on the Fringe design system">
        <DCSection id="flow" title="Mobile flow">
          {SCREENS.map(s => (
            <DCArtboard key={s.id} id={s.id} label={s.label} width={390} height={844}>
              <div data-screen-label={s.label}>
                <Phone><s.Comp/></Phone>
              </div>
            </DCArtboard>
          ))}
        </DCSection>
        <DCSection id="desktop" title="Desktop · Butter & Sage" subtitle="Late-flow screens as full-width desktop layouts">
          <DCArtboard id="d7" label="07 · Estimate — Butter" width={1440} height={900}>
            <div data-screen-label="07 · Estimate — Butter" style={{ width: 1440, height: 900, background: '#fff', boxShadow: '0 24px 60px rgba(17,17,17,0.18)', overflow: 'hidden' }}>
              <window.D_Estimate_Butter/>
            </div>
          </DCArtboard>
          <DCArtboard id="d8" label="08 · Booking — Sage" width={1440} height={900}>
            <div data-screen-label="08 · Booking — Sage" style={{ width: 1440, height: 900, background: '#fff', boxShadow: '0 24px 60px rgba(17,17,17,0.18)', overflow: 'hidden' }}>
              <window.D_Booking_Sage/>
            </div>
          </DCArtboard>
          <DCArtboard id="d9" label="09 · Confirm — Butter" width={1440} height={900}>
            <div data-screen-label="09 · Confirm — Butter" style={{ width: 1440, height: 900, background: '#fff', boxShadow: '0 24px 60px rgba(17,17,17,0.18)', overflow: 'hidden' }}>
              <window.D_Confirm_Butter/>
            </div>
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

</body>
</html>
