widgets:
- id: admin.media.preview-frame
  name: PreviewFrame
  status: scaffolded
  classification:
    level: organism
    description: PreviewFrame participates in the Admin DSL component system as a organism; its level controls scaffold location
      and Storybook grouping.
  source_mapping:
    current_constructs:
    - case "previewFrame"
    current_files:
    - path: web/src/admin-dsl/render.tsx
      notes: Current renderer source to inspect for this construct.
  intent:
    purpose: PreviewFrame widget.
    design_rationale: PreviewFrame extracts a named React boundary from the old Admin DSL renderer so behavior, stories, styling,
      and action context can be reviewed independently.
    adapter_boundary: The Admin DSL adapter should convert raw node props/actions into typed PreviewFrame props. PreviewFrame
      should not parse AdminNode JSON or call backend dispatch helpers directly.
    implementation_notes:
    - Implement PreviewFrame using design tokens and typed props from this IR.
    - Keep transport/adapter compatibility outside the visual component.
    accessibility_notes:
    - Ensure PreviewFrame exposes semantic roles, labels, focus behavior, and keyboard interaction appropriate to its rendered
      controls.
  contract:
    props:
      PreviewFrameProps:
        doc: Props for PreviewFrame. These are normalized widget props produced by adapters or callers, not raw Admin DSL
          JSON.
        fields:
          previewId:
            type: string
            required: true
            doc: 'previewId configures preview frame. Type: string.'
          kicker:
            type: string
            required: false
            doc: 'kicker configures preview frame. Type: string.'
          title:
            type: string
            required: true
            doc: Primary heading or title rendered by PreviewFrame.
          body:
            type: string
            required: false
            doc: Optional body copy rendered by PreviewFrame.
          url:
            type: string
            required: false
            doc: External or internal URL rendered by PreviewFrame.
          height:
            type: number
            required: false
            doc: Preferred preview height for PreviewFrame.
          placeholder:
            type: string
            required: false
            doc: Placeholder text for the empty input state in PreviewFrame.
          actions:
            type: ActionViewModel[]
            required: false
            doc: Ordered action list for the PreviewFrame slot. Presentation should be derived from semantic slot and action
              intent.
          onAction:
            type: PanelActionHandler
            required: false
            doc: Callback invoked by PreviewFrame with action metadata and typed context.
        extends: CommonWidgetProps
    action_slots:
      previewActions:
        doc: previewActions action slot for PreviewFrame. The widget emits the declared context through onAction and adapters
          lower it to runtime dispatch.
        callback: onAction
        action_type: ActionViewModel
        cardinality: many
        context_type: PreviewactionsContext
        context:
          value:
            type: unknown
            required: false
            doc: Optional contextual payload for the previewActions slot on PreviewFrame.
        lowering:
          adapter: dispatchAdminAction
          note: Adapter lowers this typed callback into Admin DSL dispatch.
  examples:
    BasicUsage:
      doc: Demonstrates the normalized props expected by PreviewFrame. Use this as a scaffold for real stories and implementation
        tests.
      demonstrates:
      - Typed PreviewFrame props after adapter lowering.
      - Widget-level usage without raw Admin DSL parsing.
      code: <PreviewFrame />
  stories:
    IframeConnected:
      doc: Tests the IframeConnected scenario for PreviewFrame with representative fixtures and assertions.
      viewport: desktop
      fixtures:
        scenario: iframeConnected
      asserts:
      - PreviewFrame renders the IframeConnected scenario without layout breakage.
      - The relevant semantic state is visible to users and test selectors.
    Placeholder:
      doc: Tests the Placeholder scenario for PreviewFrame with representative fixtures and assertions.
      viewport: desktop
      fixtures:
        scenario: placeholder
      asserts:
      - PreviewFrame renders the Placeholder scenario without layout breakage.
      - The relevant semantic state is visible to users and test selectors.
    WithBodyAndActions:
      doc: Tests the WithBodyAndActions scenario for PreviewFrame with representative fixtures and assertions.
      viewport: desktop
      fixtures:
        scenario: withBodyAndActions
      asserts:
      - PreviewFrame renders the WithBodyAndActions scenario without layout breakage.
      - The relevant semantic state is visible to users and test selectors.
    TallPreview:
      doc: Tests the TallPreview scenario for PreviewFrame with representative fixtures and assertions.
      viewport: desktop
      fixtures:
        scenario: tallPreview
      asserts:
      - PreviewFrame renders the TallPreview scenario without layout breakage.
      - The relevant semantic state is visible to users and test selectors.
    MobilePreview:
      doc: Tests the MobilePreview scenario for PreviewFrame with representative fixtures and assertions.
      viewport: desktop
      fixtures:
        scenario: mobilePreview
      asserts:
      - PreviewFrame renders the MobilePreview scenario without layout breakage.
      - The relevant semantic state is visible to users and test selectors.
  outputs:
    component:
      path: web/src/admin-dsl/widgets/organisms/PreviewFrame/PreviewFrame.tsx
    types:
      path: web/src/admin-dsl/widgets/organisms/PreviewFrame/PreviewFrame.types.ts
    stories:
      path: web/src/admin-dsl/widgets/organisms/PreviewFrame/PreviewFrame.stories.tsx
    barrel:
      path: web/src/admin-dsl/widgets/organisms/PreviewFrame/index.ts
    tests:
      path: web/src/admin-dsl/widgets/organisms/PreviewFrame/PreviewFrame.test.tsx
  implementation_todos:
  - id: replace-generated-scaffold-placeholder-with-final-implementation
    severity: required
    doc: Replace generated scaffold placeholder with final implementation.
