widgets:
- id: admin.resource.resource-table
  name: ResourceTable
  status: scaffolded
  classification:
    level: organism
    description: ResourceTable participates in the Admin DSL component system as a organism; its level controls scaffold location
      and Storybook grouping.
  source_mapping:
    current_constructs:
    - case "resourceTable", renderTableCell, bulk bar, pagination, and mobile table CSS in responsiveCss
    current_files:
    - path: web/src/admin-dsl/render.tsx
      notes: Current renderer source to inspect for this construct.
  intent:
    purpose: Render semantic resource rows as a desktop table and mobile card list. This is the most important information-dense
      Admin DSL widget.
    design_rationale: Primary dense data organism. It owns desktop table/mobile card behavior, selection, row actions, bulk
      actions, empty state, and pagination composition.
    adapter_boundary: Adapter reads current Admin DSL columns/rows/actions and turns placements into rowActions, rowOverflow,
      bulkActions, and pagination actions.
    implementation_notes:
    - Implement ResourceTable using design tokens and typed props from this IR.
    - Keep transport/adapter compatibility outside the visual component.
    accessibility_notes:
    - Ensure ResourceTable exposes semantic roles, labels, focus behavior, and keyboard interaction appropriate to its rendered
      controls.
  contract:
    props:
      ResourceTableColumn:
        doc: Props for ResourceTable. These are normalized widget props produced by adapters or callers, not raw Admin DSL
          JSON.
        fields:
          id:
            type: string
            required: true
            doc: Stable DOM/data id for the ResourceTable instance.
          accessor:
            type: keyof Row | string
            required: false
            doc: 'accessor configures resource table. Type: keyof Row | string.'
          label:
            type: string
            required: false
            doc: Human-readable label rendered by ResourceTable.
          kind:
            type: ResourceTableColumnKind
            required: false
            doc: 'kind configures resource table. Type: ResourceTableColumnKind.'
          primary:
            type: boolean
            required: false
            doc: 'primary configures resource table. Type: boolean.'
          tone:
            type: string
            required: false
            doc: Visual tone used for status, emphasis, or border treatment in ResourceTable.
          width:
            type: number | string
            required: false
            doc: 'width configures resource table. Type: number | string.'
          map:
            type: 'Record<string, { label: string; tone?: string }>'
            required: false
            doc: 'map configures resource table. Type: Record<string, { label: string; tone?: string }>.'
      ResourceTableProps:
        doc: Props for ResourceTable. These are normalized widget props produced by adapters or callers, not raw Admin DSL
          JSON.
        fields:
          tableId:
            type: string
            required: true
            doc: Stable table id used by ResourceTable for selection state, action context, and test hooks.
          columns:
            type: ResourceTableColumn<Row>[]
            required: true
            doc: Column definitions that tell ResourceTable how to label, access, and render row values.
          rows:
            type: Row[]
            required: true
            doc: Row data rendered by ResourceTable. Row-specific actions receive entries from this collection as context.
          selectable:
            type: boolean
            required: false
            doc: Whether ResourceTable exposes row selection and bulk-toolbar behavior.
          selectedRowIds:
            type: string[]
            required: false
            doc: Currently selected row ids for controlled selection behavior in ResourceTable.
          bulkLabel:
            type: string
            required: false
            doc: Label describing the current bulk-action scope in ResourceTable.
          empty:
            type: React.ReactNode
            required: false
            doc: 'empty configures resource table. Type: React.ReactNode.'
          rowActions:
            type: ActionViewModel[]
            required: false
            doc: Actions that operate on an individual row in ResourceTable.
          bulkActions:
            type: ActionViewModel[]
            required: false
            doc: Actions that operate on selected or visible rows in ResourceTable.
          pagination:
            type: '{'
            required: false
            doc: Paging state and navigation actions for ResourceTable.
          page:
            type: number
            required: true
            doc: 'page configures resource table. Type: number.'
          total:
            type: number
            required: true
            doc: 'total configures resource table. Type: number.'
          actions:
            type: ActionViewModel[]
            required: false
            doc: Ordered action list for the ResourceTable slot. Presentation should be derived from semantic slot and action
              intent.
          onRowAction:
            type: TableRowActionHandler<Row>
            required: false
            doc: Callback invoked by ResourceTable with table id, row, and optional row id.
          onBulkAction:
            type: TableBulkActionHandler<Row>
            required: false
            doc: Callback invoked by ResourceTable with table id, selected ids, scope, and row data.
          onSelectionChange:
            type: '(context: { tableId: string; selectedRowIds: string[] }) => void'
            required: false
            doc: Callback emitted when ResourceTable row selection changes.
        extends: <Row = Record<string, unknown>>  CommonWidgetProps
    action_slots:
      rowActions:
        doc: Row actions receive table and row context.
        callback: onRowAction
        action_type: ActionViewModel
        cardinality: many
        context_type: RowactionsContext
        context:
          value:
            type: unknown
            required: false
            doc: 'Context described in v1 IR as: { tableId, row, rowId }'
        lowering:
          adapter: dispatchAdminAction
          note: The widget emits typed context through the callback; the Admin DSL adapter lowers it to dispatchAdminAction
            or backend action transport.
      rowOverflow:
        doc: Overflow is row-scoped but compact and menu-oriented.
        callback: onRowAction
        action_type: ActionViewModel
        cardinality: many
        context_type: RowoverflowContext
        context:
          value:
            type: unknown
            required: false
            doc: 'Context described in v1 IR as: { tableId, row, rowId }'
        lowering:
          adapter: dispatchAdminAction
          note: The widget emits typed context through the callback; the Admin DSL adapter lowers it to dispatchAdminAction
            or backend action transport.
      bulkToolbar:
        doc: Bulk actions receive table, visible/selected scope, rows, and selected IDs.
        callback: onBulkAction
        action_type: ActionViewModel
        cardinality: many
        context_type: BulktoolbarContext
        context:
          value:
            type: unknown
            required: false
            doc: 'Context described in v1 IR as: { tableId, scope, rows, selectedRowIds }'
        lowering:
          adapter: dispatchAdminAction
          note: The widget emits typed context through the callback; the Admin DSL adapter lowers it to dispatchAdminAction
            or backend action transport.
      pagination:
        doc: Pagination actions receive page/total context.
        callback: onAction
        action_type: ActionViewModel
        cardinality: many
        context_type: PaginationContext
        context:
          value:
            type: unknown
            required: false
            doc: 'Context described in v1 IR as: table/page'
        lowering:
          adapter: dispatchAdminAction
          note: The widget emits typed context through the callback; the Admin DSL adapter lowers it to dispatchAdminAction
            or backend action transport.
  examples:
    DefaultUsage:
      doc: Demonstrates the intended normalized usage of ResourceTable after adapter lowering.
      demonstrates:
      - Normalized props for ResourceTable.
      - Adapter boundary expectations.
      code: "<ResourceTable\n  tableId=\"requests\"\n  columns={requestColumns}\n  rows={requestRows}\n  selectable\n  bulkLabel=\"\
        3 visible requests\"\n  bulkActions={[assignAction]}\n  onRowAction={(action, ctx) => dispatch(action, ctx)}\n  onBulkAction={(action,\
        \ ctx) => dispatch(action, ctx)}\n/>"
  stories:
    DefaultRows:
      doc: Tests ResourceTable with normal populated rows and standard dense table spacing.
      viewport: desktop
      fixtures:
        scenario: defaultRows
      asserts:
      - ResourceTable renders the DefaultRows scenario without layout breakage.
      - The relevant semantic state is visible to users and test selectors.
    SelectableWithBulkToolbar:
      doc: Tests selection-enabled ResourceTable with visible/selected bulk action toolbar.
      viewport: desktop
      fixtures:
        scenario: selectableWithBulkToolbar
      asserts:
      - ResourceTable renders the SelectableWithBulkToolbar scenario without layout breakage.
      - The relevant semantic state is visible to users and test selectors.
    RowActions:
      doc: Tests row-scoped actions in ResourceTable.
      viewport: desktop
      fixtures:
        scenario: rowActions
      asserts:
      - ResourceTable renders the RowActions scenario without layout breakage.
      - The relevant semantic state is visible to users and test selectors.
    OverflowActions:
      doc: Tests compact overflow action presentation in ResourceTable.
      viewport: desktop
      fixtures:
        scenario: overflowActions
      asserts:
      - ResourceTable renders the OverflowActions scenario without layout breakage.
      - The relevant semantic state is visible to users and test selectors.
    EmptyState:
      doc: Tests empty-state substitution or composition in ResourceTable.
      viewport: desktop
