widgets:
- name: ResourceTable
  current_source: case "resourceTable", renderTableCell, bulk bar, pagination, and mobile table CSS in responsiveCss
  classification:
    level: organism
  purpose: Render semantic resource rows as a desktop table and mobile card list. This is the most important information-dense
    Admin DSL widget.
  props: |-
    export type ResourceTableColumnKind =
      | "text"
      | "badge"
      | "boolean"
      | "dragHandle"
      | "actions"
      | "overflowActions"
      | "money"
      | "relativeTime";

    export interface ResourceTableColumn<Row = Record<string, unknown>> {
      id: string;
      accessor?: keyof Row | string;
      label?: string;
      kind?: ResourceTableColumnKind;
      primary?: boolean;
      tone?: string;
      width?: number | string;
      map?: Record<string, { label: string; tone?: string }>;
    }

    export interface ResourceTableProps<Row = Record<string, unknown>> extends CommonWidgetProps {
      tableId: string;
      columns: ResourceTableColumn<Row>[];
      rows: Row[];
      selectable?: boolean;
      selectedRowIds?: string[];
      bulkLabel?: string;
      empty?: React.ReactNode;
      rowActions?: ActionViewModel[];
      bulkActions?: ActionViewModel[];
      pagination?: {
        page: number;
        total: number;
        actions?: ActionViewModel[];
      };
      onRowAction?: TableRowActionHandler<Row>;
      onBulkAction?: TableBulkActionHandler<Row>;
      onSelectionChange?: (context: { tableId: string; selectedRowIds: string[] }) => void;
    }
  action_slots:
  - name: rowActions
    context: '{ tableId, row, rowId }'
    callback_prop: onRowAction
    intent: Row actions receive table and row context.
    implementation_note: The widget emits typed context through the callback; the Admin DSL adapter lowers it to dispatchAdminAction
      or backend action transport.
  - name: rowOverflow
    context: '{ tableId, row, rowId }'
    callback_prop: onRowAction
    intent: Overflow is row-scoped but compact and menu-oriented.
    implementation_note: The widget emits typed context through the callback; the Admin DSL adapter lowers it to dispatchAdminAction
      or backend action transport.
  - name: bulkToolbar
    context: '{ tableId, scope, rows, selectedRowIds }'
    callback_prop: onBulkAction
    intent: Bulk actions receive table, visible/selected scope, rows, and selected IDs.
    implementation_note: The widget emits typed context through the callback; the Admin DSL adapter lowers it to dispatchAdminAction
      or backend action transport.
  - name: pagination
    context: table/page
    callback_prop: onAction
    intent: Pagination actions receive page/total context.
    implementation_note: The widget emits typed context through the callback; the Admin DSL adapter lowers it to dispatchAdminAction
      or backend action transport.
  usage_example: |-
    <ResourceTable
      tableId="requests"
      columns={requestColumns}
      rows={requestRows}
      selectable
      bulkLabel="3 visible requests"
      bulkActions={[assignAction]}
      onRowAction={(action, ctx) => dispatch(action, ctx)}
      onBulkAction={(action, ctx) => dispatch(action, ctx)}
    />
  storybook_stories:
  - DefaultRows
  - SelectableWithBulkToolbar
  - RowActions
  - OverflowActions
  - EmptyState
  - Pagination
  - StatusBadgeCells
  - DragHandleColumn
  - MobileCards
  - LongTextAndDenseRows
  - ActionDispatchContexts
  file_layout: |-
    web/src/admin-dsl/widgets/organisms/ResourceTable/
      ResourceTable.tsx
      ResourceTable.types.ts
      ResourceTable.stories.tsx
      ResourceTable.test.tsx
      ResourceTable.fixtures.ts
      parts/
        BulkActionBar.tsx
        PaginationBar.tsx
        ResourceTableCell.tsx
        ResourceTableRow.tsx
      index.ts
  human_notes:
    intent: Primary dense data organism. It owns desktop table/mobile card behavior, selection, row actions, bulk actions,
      empty state, and pagination composition.
    adapter_boundary: Adapter reads current Admin DSL columns/rows/actions and turns placements into rowActions, rowOverflow,
      bulkActions, and pagination actions.
    slot_intent:
      rowActions: Row actions receive table and row context.
      rowOverflow: Overflow is row-scoped but compact and menu-oriented.
      bulkToolbar: Bulk actions receive table, visible/selected scope, rows, and selected IDs.
      pagination: Pagination actions receive page/total context.
    storybook_intent: Stories should be the canonical visual harness for dense admin tables, including mobile cards and contextual
      action payloads.
  xxx:
  - Replace placeholder with desktop table plus mobile card implementation.
  - Wire real selection state and row/bulk callback contexts.
- name: ResourceTableCell
  current_source: renderTableCell
  classification:
    level: molecule
  props: |-
    export interface ResourceTableCellProps<Row = Record<string, unknown>> {
      column: ResourceTableColumn<Row>;
      row: Row;
      tableId: string;
      onRowAction?: TableRowActionHandler<Row>;
    }
  action_slots:
  - name: rowAction
    context: table row when column kind is actions/overflowActions
    callback_prop: onRowAction
    intent: Only action/overflow cells invoke row-scoped callbacks; text/badge/boolean cells are pure display.
    implementation_note: The widget emits typed context through the callback; the Admin DSL adapter lowers it to dispatchAdminAction
      or backend action transport.
  storybook_stories:
  - TextCell
  - PrimaryTextCell
  - MutedTextCell
  - BadgeMappedCell
  - BooleanCell
  - DragHandleCell
  - ActionsCell
  - OverflowCell
  file_layout: inside ResourceTable/parts/ unless promoted to standalone widget later.
  human_notes:
    intent: Localizes cell-kind rendering so ResourceTable is not a pile of conditional JSX. It can later become a registry
      of cell renderers.
    adapter_boundary: Receives already-normalized column and row data; should not parse AdminNode directly.
    slot_intent:
      rowAction: Only action/overflow cells invoke row-scoped callbacks; text/badge/boolean cells are pure display.
    storybook_intent: Stories should cover every current cell kind and make unmapped kinds obvious.
  xxx:
  - Implement real cell-kind rendering or a cell renderer registry.
