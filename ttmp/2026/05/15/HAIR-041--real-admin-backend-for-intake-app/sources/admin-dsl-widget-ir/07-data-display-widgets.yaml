- id: admin.data-display.metric-card
  name: MetricCard
  status: promoted
  classification:
    level: molecule
    description: MetricCard participates in the Admin DSL component system as a molecule; its level controls scaffold location
      and Storybook grouping.
  source_mapping:
    current_constructs:
    - case "metricCard"
    current_files:
    - path: web/src/admin-dsl/render.tsx
      notes: Current renderer source to inspect for this construct.
  intent:
    purpose: MetricCard widget.
    design_rationale: MetricCard extracts a named React boundary from the old Admin DSL renderer so behavior, stories, styling,
      and action context can be reviewed independently.
    adapter_boundary: The Admin DSL adapter should convert raw node props/actions into typed MetricCard props. MetricCard
      should not parse AdminNode JSON or call backend dispatch helpers directly.
    implementation_notes:
    - Implement MetricCard using design tokens and typed props from this IR.
    - Keep transport/adapter compatibility outside the visual component.
    accessibility_notes:
    - Ensure MetricCard exposes semantic roles, labels, focus behavior, and keyboard interaction appropriate to its rendered
      controls.
