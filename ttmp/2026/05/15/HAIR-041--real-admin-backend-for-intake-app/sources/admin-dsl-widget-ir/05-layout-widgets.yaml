- name: Panel
  current_source: case "panel" in renderAdminNode
  classification:
    level: organism
  props: |-
    export interface PanelProps extends CommonWidgetProps {
      title?: string;
      subtitle?: string;
      eyebrow?: string;
      body?: string;
      padding?: "none" | "normal";
      toolbarActions?: ActionViewModel[];
      footerActions?: ActionViewModel[];
      children?: React.ReactNode;
      onToolbarAction?: PanelActionHandler;
      onFooterAction?: PanelActionHandler;
    }
  action_slots:
  - name: toolbarActions
    context: panel
  - name: footerActions
    context: panel
  usage_example: |-
    <Panel
      title="Today’s queue"
      density="compact"
      padding="none"
      footerActions={[assignAction]}
      onFooterAction={handlePanelFooterAction}
    >
      <ResourceTable {...tableProps} />
    </Panel>
  storybook_stories:
  - Default
  - CompactNoPadding
  - WithToolbarAction
  - WithFooterActions
  - BodyOnly
  - NestedResourceTable
  - MobilePanelPadding
  file_layout: |-
    web/src/admin-dsl/widgets/organisms/Panel/
      Panel.tsx
      Panel.types.ts
      Panel.stories.tsx
      Panel.test.tsx
      index.ts
