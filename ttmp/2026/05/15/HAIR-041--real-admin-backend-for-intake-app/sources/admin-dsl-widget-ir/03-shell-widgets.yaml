summary: Shell widgets extracted from AdminPageRenderer and WorkbenchShell.
widgets:
- name: WorkbenchShell
  current_source: WorkbenchShell in web/src/admin-dsl/render.tsx
  classification:
    level: organism
    role: shell
  purpose: 'Render the information-dense admin workbench frame: sidebar on desktop, sticky topbar on mobile, global background,
    content max width, and page body region.'
  props: |-
    export interface WorkbenchShellProps extends CommonWidgetProps {
      pageId: string;
      title: string;
      sidebar: SidebarNavProps;
      user?: WorkbenchUser;
      children: React.ReactNode;
    }

    export interface WorkbenchUser {
      name: string;
      role?: string;
      initials?: string;
    }
  action_slots:
  - name: sidebarNav
    signature: |-
      onSidebarAction?: (action: ActionViewModel, context: {
        item: SidebarNavItem;
        activeItemId?: string;
      }) => void;
    callback_prop: onSidebarAction
    intent: Navigation actions are frontend-rendered but may still dispatch to the backend flow. The context must include
      the clicked nav item and active item so handlers can update page state deterministically.
    implementation_note: The widget emits typed context through the callback; the Admin DSL adapter lowers it to dispatchAdminAction
      or backend action transport.
  usage_example: |-
    <WorkbenchShell
      pageId="admin-intake"
      title="Fringe Admin"
      sidebar={{ activeItemId: "requests", items }}
      user={{ name: "Admin User", role: "Administrator", initials: "AD" }}
      onSidebarAction={handleSidebarAction}
    >
      <PageHeader title="Request Triage" />
      <DashboardGrid>{/* panels */}</DashboardGrid>
    </WorkbenchShell>
  storybook_stories:
  - DefaultDesktop
  - MobileTopbar
  - LongNavigation
  - NoUser
  - ActionDispatch
  file_layout: |-
    web/src/admin-dsl/widgets/organisms/WorkbenchShell/
      WorkbenchShell.tsx
      WorkbenchShell.types.ts
      WorkbenchShell.stories.tsx
      WorkbenchShell.test.tsx
      index.ts
  human_notes:
    intent: Owns the full information-dense admin workspace frame. It should make global navigation, user identity, page body
      width, and mobile topbar behavior explicit instead of embedding them inside the renderer switch.
    adapter_boundary: The Admin DSL adapter should translate shell.props.sidebar into SidebarNavProps and bind sidebar item
      actions; the widget should not parse raw AdminPage objects.
    slot_intent:
      sidebarNav: Navigation actions are frontend-rendered but may still dispatch to the backend flow. The context must include
        the clicked nav item and active item so handlers can update page state deterministically.
    storybook_intent: Stories should prove desktop sidebar, mobile topbar, long navigation, missing user footer, and contextual
      sidebar dispatch.
  xxx:
  - Replace generated scaffold placeholder with final implementation.
  - Keep raw Admin DSL JSON parsing in adapters, not in this widget.
- name: DefaultAdminShell
  current_source: fallback branch in AdminPageRenderer in web/src/admin-dsl/render.tsx
  classification:
    level: organism
    role: shell
  purpose: Render non-workbench Admin DSL pages with optional side surfaces. This keeps the legacy/default page shell separate
    from workbench chrome.
  props: |-
    export interface DefaultAdminShellProps extends CommonWidgetProps {
      pageId: string;
      shellKind: "admin" | "dashboard" | "resource" | "calendar" | "settings" | "bare";
      eyebrow?: string;
      title: string;
      description?: string;
      main: React.ReactNode;
      side?: React.ReactNode;
    }
  action_slots: []
  storybook_stories:
  - MainOnly
  - WithSideSurfaces
  - CalendarShell
  - MobileSideColumn
  file_layout: |-
    web/src/admin-dsl/widgets/organisms/DefaultAdminShell/
      DefaultAdminShell.tsx
      DefaultAdminShell.types.ts
      DefaultAdminShell.stories.tsx
      index.ts
  human_notes:
    intent: Keeps the non-workbench shell path explicit while the workbench shell evolves. This prevents side-surface layout
      and page chrome from being hidden in AdminPageRenderer.
    adapter_boundary: Adapter receives AdminPage and separates main region from side surfaces; widget receives already-rendered
      main/side React nodes.
    storybook_intent: Stories should show main-only pages, side surfaces, calendar shell color, and mobile stacking.
  xxx:
  - Replace generated scaffold placeholder with final implementation.
  - Keep raw Admin DSL JSON parsing in adapters, not in this widget.
