schema_version: 1
artifact_type: admin_dsl_react_widget_ir
source_document: ttmp/2026/05/15/HAIR-041--real-admin-backend-for-intake-app/design-doc/08-admin-dsl-react-widget-ir-catalog.md
category: action_widgets
summary: Action widgets extracted from renderActions, table overflow handling, and special-case action buttons.
widgets:
- name: ActionButton
  current_source: renderActions button branch in web/src/admin-dsl/render.tsx plus row/bulk/search special buttons
  classification:
    level: atom
  purpose: Render one action with consistent disabled, loading, primary, danger, subtle, and placement-aware styling.
  props: |-
    export interface ActionButtonProps<C = unknown> extends CommonWidgetProps {
      action: ActionViewModel;
      context?: C;
      variant?: "solid" | "soft" | "subtle" | "danger" | "overflow";
      size?: "sm" | "md" | "touch";
      onAction?: (action: ActionViewModel, context: C) => void;
    }
  action_slots:
  - name: self
    notes: The widget executes the action it receives through onAction.
    callback_prop: onAction
    intent: The caller chooses the semantic slot and passes an onAction callback; ActionButton only renders and invokes.
    implementation_note: The widget emits typed context through the callback; the Admin DSL adapter lowers it to dispatchAdminAction
      or backend action transport.
  storybook_stories:
  - Primary
  - Secondary
  - Danger
  - SubtleLink
  - Loading
  - Disabled
  - TouchTargetMobile
  file_layout: |-
    web/src/admin-dsl/widgets/atoms/ActionButton/
      ActionButton.tsx
      ActionButton.types.ts
      ActionButton.stories.tsx
      index.ts
  human_notes:
    intent: Unifies visual treatment for action metadata so primary, danger, subtle, loading, disabled, and touch-target rules
      do not get reimplemented in every table/panel/form branch.
    adapter_boundary: The widget receives an ActionViewModel and context. It should not know AdminNode or dispatchAdminAction
      directly.
    slot_intent:
      self: The caller chooses the semantic slot and passes an onAction callback; ActionButton only renders and invokes.
    storybook_intent: Stories should pin visual variants and prevent regressions in button shape, subtle row links, danger
      styling, and loading/disabled states.
  xxx:
  - Replace placeholder with actual button element styles from design tokens.
  - Map variant/slot semantics without reintroducing placement-specific conditionals everywhere.
- name: ActionGroup
  current_source: renderActions wrapper in web/src/admin-dsl/render.tsx
  classification:
    level: molecule
  purpose: Render a list of actions with consistent spacing, wrapping, and slot-specific visual treatment.
  props: |-
    export interface ActionGroupProps<C = unknown> extends CommonWidgetProps {
      actions: ActionViewModel[];
      context?: C;
      slot: "pageHeader" | "toolbar" | "panelToolbar" | "panelFooter" | "row" | "rowOverflow" | "bulkToolbar" | "formFooter" | "calendarCell" | "sidebarNav" | "footer" | "detail" | "overflow";
      align?: "start" | "end" | "between";
      onAction?: (action: ActionViewModel, context: C) => void;
    }
  action_slots:
  - name: actions
    notes: Slot-specific list of actions rendered as ActionButton children.
    callback_prop: onAction
    intent: A group represents one semantic slot, not an arbitrary pile of buttons. The slot name should influence density,
      wrapping, and hierarchy.
    implementation_note: The widget emits typed context through the callback; the Admin DSL adapter lowers it to dispatchAdminAction
      or backend action transport.
  storybook_stories:
  - PageHeaderActions
  - PanelFooterActions
  - RowActions
  - BulkToolbarActions
  - FormFooterActions
  - OverflowActions
  - WrappingMobile
  file_layout: |-
    web/src/admin-dsl/widgets/molecules/ActionGroup/
      ActionGroup.tsx
      ActionGroup.types.ts
      ActionGroup.stories.tsx
      index.ts
  human_notes:
    intent: Provides the flex/wrap/alignment behavior for a slot of actions. It is the main bridge between semantic action
      slots and repeated ActionButton atoms.
    adapter_boundary: Adapters should choose slot names such as pageHeader or bulkToolbar; the widget chooses spacing and
      presentation defaults for that slot.
    slot_intent:
      actions: A group represents one semantic slot, not an arbitrary pile of buttons. The slot name should influence density,
        wrapping, and hierarchy.
    storybook_intent: Stories should prove page-header, row, panel-footer, form-footer, overflow, and bulk-toolbar groups
      at desktop and mobile widths.
  xxx:
  - Replace placeholder with ActionButton composition.
  - Define exact wrapping rules for mobile and dense row contexts.
- name: OverflowActionButton
  current_source: renderTableCell branch for kind === "overflowActions"
  classification:
    level: atom
  purpose: Render the ellipsis affordance for row overflow menus. First implementation can dispatch the first action, matching
    current behavior. Later implementation can open a real menu.
  props: |-
    export interface OverflowActionButtonProps<C = unknown> {
      label?: string;
      actions: ActionViewModel[];
      context: C;
      onAction?: (action: ActionViewModel, context: C) => void;
    }
  action_slots:
  - name: overflowActions
    notes: Uses the provided context and selected action.
    callback_prop: onAction
    intent: Overflow actions are row-scoped actions with compact presentation. Initial scaffold can invoke the first action,
      but final implementation should open a menu.
    implementation_note: The widget emits typed context through the callback; the Admin DSL adapter lowers it to dispatchAdminAction
      or backend action transport.
  storybook_stories:
  - SingleOverflowAction
  - NoActionsDisabled
  - FutureMenuPreview
  file_layout: |-
    web/src/admin-dsl/widgets/atoms/OverflowActionButton/
      OverflowActionButton.tsx
      OverflowActionButton.types.ts
      OverflowActionButton.stories.tsx
      index.ts
  human_notes:
    intent: Represents row overflow affordance as a named atom so the current ellipsis behavior can later grow into a real
      menu without changing ResourceTable cell contracts.
    adapter_boundary: The table cell passes row context and available actions. The widget should not fetch row actions from
      raw row JSON.
    slot_intent:
      overflowActions: Overflow actions are row-scoped actions with compact presentation. Initial scaffold can invoke the
        first action, but final implementation should open a menu.
    storybook_intent: Stories should distinguish single-action shortcut behavior from future multi-action menu behavior.
  xxx:
  - Implement menu behavior before supporting multiple overflow actions.
