- name: Panel
  current_source: case "panel" in renderAdminNode
  classification:
    level: organism
  props: |-
    export interface PanelProps extends CommonWidgetProps {
      title?: string;
      subtitle?: string;
      eyebrow?: string;
      body?: string;
      padding?: "none" | "normal";
      toolbarActions?: ActionViewModel[];
      footerActions?: ActionViewModel[];
      children?: React.ReactNode;
      onToolbarAction?: PanelActionHandler;
      onFooterAction?: PanelActionHandler;
    }
  action_slots:
  - name: toolbarActions
    context: panel
    callback_prop: onToolbarAction
    intent: Toolbar actions are local to the panel header and usually secondary.
    implementation_note: The widget emits typed context through the callback; the Admin DSL adapter lowers it to dispatchAdminAction
      or backend action transport.
  - name: footerActions
    context: panel
    callback_prop: onFooterAction
    intent: Footer actions are local to the panel result/flow and should preserve panel context.
    implementation_note: The widget emits typed context through the callback; the Admin DSL adapter lowers it to dispatchAdminAction
      or backend action transport.
  usage_example: |-
    <Panel
      title="Today’s queue"
      density="compact"
      padding="none"
      footerActions={[assignAction]}
      onFooterAction={handlePanelFooterAction}
    >
      <ResourceTable {...tableProps} />
    </Panel>
  storybook_stories:
  - Default
  - CompactNoPadding
  - WithToolbarAction
  - WithFooterActions
  - BodyOnly
  - NestedResourceTable
  - MobilePanelPadding
  file_layout: |-
    web/src/admin-dsl/widgets/organisms/Panel/
      Panel.tsx
      Panel.types.ts
      Panel.stories.tsx
      Panel.test.tsx
      index.ts
  human_notes:
    intent: Central admin surface primitive for dense workbench content. It owns header/body/footer chrome, padding, density,
      and action placement.
    adapter_boundary: Adapter maps toolbarActions/footerActions and renders children separately; widget receives typed React
      children and action arrays.
    slot_intent:
      toolbarActions: Toolbar actions are local to the panel header and usually secondary.
      footerActions: Footer actions are local to the panel result/flow and should preserve panel context.
    storybook_intent: Stories should cover no-padding table panels, toolbar actions, footer actions, body-only panels, and
      mobile padding.
