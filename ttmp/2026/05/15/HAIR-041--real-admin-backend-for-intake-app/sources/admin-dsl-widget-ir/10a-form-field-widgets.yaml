schema_version: 2
artifact_type: admin_dsl_widget_definition_ir
category: form_field_widgets
summary: Concrete form field leaf widgets extracted from the legacy FieldPreview helper in render.tsx.
source_document: ttmp/2026/05/15/HAIR-041--real-admin-backend-for-intake-app/design-doc/08-admin-dsl-react-widget-ir-catalog.md
schema_document: ttmp/2026/05/15/HAIR-041--real-admin-backend-for-intake-app/design-doc/09-widget-definition-ir-yaml-format-spec.md
status: promoted
shared_design:
  field_shell:
    widget_id: admin.form-field.field-shell
    purpose: Shared label, help, error, disabled, and read-only chrome used by concrete field leaves.
    boundary: FieldShell owns visual/control-adjacent chrome only; concrete leaf widgets own actual input semantics.
  value_model:
    mode: uncontrolled-by-default
    rationale: Preserve existing FieldPreview/defaultValue behavior and AdminForm FormData collection before introducing controlled
      form sessions.
widgets:
- id: admin.form-field.field-shell
  name: FieldShell
  status: promoted
  classification:
    level: atom
    description: FieldShell participates in the Admin DSL field system as a atom; it extracts field-shell behavior from FieldPreview.
  source_mapping:
    current_constructs:
    - field-shell
    current_files:
    - path: web/src/admin-dsl/render.tsx
      notes: Legacy FieldPreview branch and form-field adapter source.
  intent:
    purpose: Shared label/help/error/status chrome around concrete field controls.
    design_rationale: FieldShell creates a typed field boundary so label/error styling and input semantics can be reviewed
      independently.
    adapter_boundary: The Admin DSL adapter converts raw field node props into typed FieldShell props; the widget does not
      import AdminNode or dispatch helpers.
    implementation_notes:
    - Preserve uncontrolled defaultValue/defaultChecked behavior unless a future form-session task explicitly moves fields
      to controlled state.
    - Use FieldShell for label/help/error chrome where the widget renders a concrete control.
    accessibility_notes:
    - Associate labels, descriptions, and errors with the underlying input using stable ids.
    - Preserve native keyboard behavior for the field control.
  contract:
    props:
      FieldShellProps:
        doc: Props for FieldShell. These are normalized widget props produced by adapters or callers, not raw Admin DSL JSON.
        extends: CommonWidgetProps
        fields:
          label:
            type: string
            required: true
            doc: Visible field label.
          name:
            type: string
            required: false
            doc: Optional field name used for htmlFor/default id derivation.
          helpText:
            type: string
            required: false
            doc: Secondary helper copy.
          error:
            type: string
            required: false
            doc: Validation error text.
          disabled:
            type: boolean
            required: false
            doc: Whether the wrapped control is disabled.
          readOnly:
            type: boolean
            required: false
            doc: Whether the wrapped control is read-only.
          required:
            type: boolean
            required: false
            doc: Whether the field is required.
          children:
            type: React.ReactNode
            required: true
            doc: Concrete input/control supplied by the field leaf.
    action_slots: {}
  examples:
    BasicUsage:
      doc: Demonstrates normalized FieldShell props after adapter lowering.
      demonstrates:
      - Typed props without raw Admin DSL parsing.
      - Shared field chrome and accessibility wiring.
      code: <FieldShell name="label" label="Label" />
  stories:
    Default:
      doc: Baseline production-like FieldShell rendering.
      viewport: desktop
      fixtures:
        scenario: default
      asserts:
      - FieldShell renders its visible label and current value/state.
    WithHelp:
      doc: Helper text remains associated with FieldShell.
      viewport: desktop
      fixtures:
        scenario: withHelp
      asserts:
      - Help text is visible and associated with the input.
    WithError:
      doc: Validation error state is visible and accessible for FieldShell.
      viewport: desktop
      fixtures:
        scenario: withError
      asserts:
      - Error text is visible and associated with the input.
    DisabledOrReadOnly:
      doc: Disabled/read-only states are visible for FieldShell.
      viewport: desktop
      fixtures:
        scenario: disabledOrReadOnly
      asserts:
      - Disabled/read-only state is visible.
    Mobile:
      doc: FieldShell remains usable in narrow containers.
      viewport: mobile
      fixtures:
        scenario: mobile
      asserts:
      - The field remains readable and touch-friendly.
  outputs:
    component:
      path: web/src/admin-dsl/widgets/atoms/FieldShell/FieldShell.tsx
    types:
      path: web/src/admin-dsl/widgets/atoms/FieldShell/FieldShell.types.ts
    stories:
      path: web/src/admin-dsl/widgets/atoms/FieldShell/FieldShell.stories.tsx
    barrel:
      path: web/src/admin-dsl/widgets/atoms/FieldShell/index.ts
  implementation_todos:
  - id: scaffold-and-promote-field-widget
    severity: required
    doc: Create typed implementation, hand-authored stories, renderer adapter mapping, validation, diary, and changelog.
