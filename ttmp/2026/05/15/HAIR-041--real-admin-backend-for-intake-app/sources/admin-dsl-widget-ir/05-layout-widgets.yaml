- id: admin.layout.page-header
  name: PageHeader
  status: scaffolded
  classification:
    level: organism
    description: PageHeader participates in the Admin DSL component system as a organism; its level controls scaffold location
      and Storybook grouping.
  source_mapping:
    current_constructs:
    - case "pageHeader" in renderAdminNode
    current_files:
    - path: web/src/admin-dsl/render.tsx
      notes: Current renderer source to inspect for this construct.
  intent:
    purpose: Owns page-level title hierarchy, breadcrumbs, description, and primary page actions. It should make the top-of-page
      layout reusable across workbench screens.
    design_rationale: Owns page-level title hierarchy, breadcrumbs, description, and primary page actions. It should make
      the top-of-page layout reusable across workbench screens.
    adapter_boundary: Adapter maps pageHeader props/actions into typed props; widget receives strings and ActionViewModel
      values only.
    implementation_notes:
    - Implement PageHeader using design tokens and typed props from this IR.
    - Keep transport/adapter compatibility outside the visual component.
    accessibility_notes:
    - Ensure PageHeader exposes semantic roles, labels, focus behavior, and keyboard interaction appropriate to its rendered
      controls.
  contract:
    props:
      PageHeaderProps:
        doc: Props for PageHeader. These are normalized widget props produced by adapters or callers, not raw Admin DSL JSON.
        fields:
          breadcrumbs:
            type: string[]
            required: false
            doc: Breadcrumb labels shown above the PageHeader title to communicate page hierarchy.
          title:
            type: string
            required: true
            doc: Primary heading or title rendered by PageHeader.
          description:
            type: string
            required: false
            doc: Optional descriptive text that explains the surrounding page or widget state.
          primaryActions:
            type: ActionViewModel[]
            required: false
            doc: High-level page actions rendered by PageHeader; these should be few and page-scoped.
          onPrimaryAction:
            type: PageActionHandler
            required: false
            doc: Callback for page-scoped primary actions emitted by PageHeader.
        extends: CommonWidgetProps
    action_slots:
      primaryActions:
        doc: Page actions should be few and high-level. They should not receive row/form context.
        callback: onPrimaryAction
        action_type: ActionViewModel
        cardinality: many
        context_type: PrimaryactionsContext
        context:
          value:
            type: unknown
            required: false
            doc: 'Context described in v1 IR as: page'
        lowering:
          adapter: dispatchAdminAction
          note: The widget emits typed context through the callback; the Admin DSL adapter lowers it to dispatchAdminAction
            or backend action transport.
  examples:
    DefaultUsage:
      doc: Demonstrates the intended normalized usage of PageHeader after adapter lowering.
      demonstrates:
      - Normalized props for PageHeader.
      - Adapter boundary expectations.
      code: "<PageHeader\n  breadcrumbs={[\"Admin DSL\", \"Workbench v2\"]}\n  title=\"Request Triage\"\n  description=\"\
        Review customer intake requests.\"\n  primaryActions={[newServiceAction]}\n  onPrimaryAction={handlePageAction}\n\
        />"
  stories:
    Default:
      doc: Tests the baseline PageHeader rendering with representative production-like data.
      viewport: desktop
      fixtures:
        scenario: default
      asserts:
      - PageHeader renders the Default scenario without layout breakage.
