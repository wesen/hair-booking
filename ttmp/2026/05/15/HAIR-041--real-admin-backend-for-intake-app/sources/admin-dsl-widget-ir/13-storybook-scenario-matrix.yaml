coverage_policy:
  purpose: Track real Storybook files/exports and separate current coverage from known gaps.
  status_values:
    complete: Story exists with meaningful fixtures and current validation.
    partial: Some coverage exists but a known scenario is missing.
    missing: Scenario is planned but no story export exists yet.
    stale: Story exists but no longer matches current implementation behavior.
  validation_commands:
    - cd web && npx tsc --noEmit
    - cd web && pnpm test -- --runInBand
    - cd web && npx storybook build --quiet
    - python3 ttmp/2026/05/15/HAIR-041--real-admin-backend-for-intake-app/scripts/08-validate-widget-promotion.py --strict-triage --skip-storybook <widget-dirs>

