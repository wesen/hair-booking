schema_version: 1
artifact_type: admin_dsl_react_widget_ir
source_document: ttmp/2026/05/15/HAIR-041--real-admin-backend-for-intake-app/design-doc/08-admin-dsl-react-widget-ir-catalog.md
category: artifact_pass_model
summary: Pass definitions are artifact-driven rather than a single fixed consecutive pipeline.
pipeline_diagram: |-
  Current artifacts
    - web/src/admin-dsl/render.tsx
    - web/src/admin-dsl/calendar.tsx
    - web/src/admin-dsl/schema.ts
    - web/src/admin-dsl/builder.ts
    - web/src/admin-dsl/actions.ts
    - web/src/admin-dsl/AdminDslWorkbench.stories.tsx
          |
          v
  React Widget IR Catalog
    - widget names
    - atom/molecule/organism classification
    - props
    - action slots / callback signatures
    - supported Admin DSL constructs
    - file path layout
    - Storybook scenario matrix
          |
          +--> file scaffold pass
          +--> Storybook skeleton pass
          +--> renderer adapter pass
          +--> prop contract generation pass
          +--> implementation prompt pass
          +--> Playwright scenario sketch pass
passes:
- name: Current renderer inventory pass
  requires:
  - render.tsx
  - calendar.tsx
  - schema.ts
  - builder.ts
  produces:
  - AdminDslConstructInventory
  notes: Extracts current node kinds, props, actions, and render branches.
- name: Widget extraction pass
  requires:
  - AdminDslConstructInventory
  - Storybook fixtures
  produces:
  - ReactWidgetIRCatalog
  notes: The markdown document and these YAML files are hand-authored versions of that artifact.
- name: File layout pass
  requires:
  - ReactWidgetIRCatalog
  produces:
  - WidgetFileScaffoldPlan
  notes: Emits directories and file names, not implementation.
- name: Storybook plan pass
  requires:
  - ReactWidgetIRCatalog
  - current stories
  produces:
  - StorybookScenarioPlan
  notes: Emits one story plan per widget plus integration scenarios.
- name: Renderer adapter pass
  requires:
  - ReactWidgetIRCatalog
  - Admin DSL schema
  produces:
  - RendererRegistryPlan
  notes: Maps Admin DSL constructs to widgets and prop adapters.
- name: Action typing pass
  requires:
  - ReactWidgetIRCatalog
  - action schema
  produces:
  - ActionSlotSignatureIR
  notes: Converts generic action placements into typed slot callback signatures.
- name: LLM elaboration pass
  requires:
  - any previous artifact
  produces:
  - implementation prompts
  - Playwright sketches
  - edge-case lists
  notes: Output may be semi-formal and reviewed by humans before code generation.
