category: renderer_adapter_plan
summary: Plan for replacing the giant switch with a small adapter registry that translates Admin DSL nodes into widget props.
adapter_interface: "export interface AdminNodeAdapter<N extends AdminNode = AdminNode, P = unknown> {\n  kind: string;\n \
  \ toProps(node: N, context: AdminRenderContext): P;\n  render(props: P): React.ReactNode;\n}"
example_resource_table_adapter: "export const resourceTableAdapter: AdminNodeAdapter<AdminNode, ResourceTableProps> = {\n\
  \  kind: \"resourceTable\",\n  toProps(node, context) {\n    const props = node.props ?? {};\n    return {\n      tableId:\
  \ String(props.id ?? node.meta?.id ?? \"table\"),\n      columns: readColumns(props),\n      rows: readRows(props),\n  \
  \    selectable: Boolean(props.selectable),\n      bulkActions: readActions(props.bulkActions),\n      rowActions: readActions(props.actions).filter((action)\
  \ => action.placement === \"row\"),\n      onRowAction: (action, rowContext) => dispatchAdminAction(context, node, action,\
  \ rowContext.row),\n      onBulkAction: (action, bulkContext) => dispatchAdminAction(context, node, action, bulkContext),\n\
  \    };\n  },\n  render(props) {\n    return <ResourceTable {...props} />;\n  },\n};"
notes:
- The adapter owns compatibility with current Admin DSL JSON.
- The widget owns visual rendering.
- Widgets should not call str, jsonArray, or jsonObject on raw AdminNode.props.
