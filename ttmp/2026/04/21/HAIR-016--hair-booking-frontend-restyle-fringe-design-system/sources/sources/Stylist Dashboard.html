<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Fringe — Stylist Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Anton&family=Oswald:wght@400;600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
  html, body { margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; background: #f6efe4; color: #111; height: 100%; }
  #root { height: 100vh; }
  * { box-sizing: border-box; }
  button { font-family: inherit; }
  .phone-scroll::-webkit-scrollbar { width: 0; }
</style>
</head>
<body>

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-system.jsx"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="stylist-dashboard.jsx"></script>
<script type="text/babel" src="stylist-pages.jsx"></script>

<script type="text/babel">
  const { FS } = window;

  function Phone({ children, label }) {
    return (
      <div data-screen-label={label} style={{
        width: 390, height: 844, borderRadius: 48,
        background: FS.color.paper,
        border: `8px solid #1a1a1a`,
        overflow: 'hidden',
        boxShadow: '0 24px 60px rgba(17,17,17,0.18)',
        position: 'relative',
      }}>
        <div className="phone-scroll" style={{ width: '100%', height: '100%', overflow: 'hidden' }}>
          {children}
        </div>
      </div>
    );
  }

  function App() {
    const { DesignCanvas, DCSection, DCArtboard } = window;
    return (
      <DesignCanvas title="Fringe — Stylist Dashboard" subtitle="Mobile · Standard variant · all pages">
        <DCSection id="today" title="Today">
          <DCArtboard id="today-a" label="Today · Standard" width={390} height={844}>
            <Phone label="Today · Standard"><window.St_Today_Standard/></Phone>
          </DCArtboard>
          <DCArtboard id="today-b" label="Today · Bold (alt)" width={390} height={844}>
            <Phone label="Today · Bold (alt)"><window.St_Today_Bold/></Phone>
          </DCArtboard>
        </DCSection>
        <DCSection id="clients" title="Clients">
          <DCArtboard id="clients-list" label="Clients · Roster" width={390} height={844}>
            <Phone label="Clients · Roster"><window.St_Clients/></Phone>
          </DCArtboard>
          <DCArtboard id="clients-detail" label="Client · Brief (Mia Chen)" width={390} height={844}>
            <Phone label="Client · Brief"><window.St_ClientDetail/></Phone>
          </DCArtboard>
        </DCSection>
        <DCSection id="inbox" title="Inbox">
          <DCArtboard id="inbox-list" label="Inbox · List" width={390} height={844}>
            <Phone label="Inbox · List"><window.St_Inbox/></Phone>
          </DCArtboard>
          <DCArtboard id="inbox-thread" label="Inbox · Thread" width={390} height={844}>
            <Phone label="Inbox · Thread"><window.St_Thread/></Phone>
          </DCArtboard>
        </DCSection>
        <DCSection id="you" title="You">
          <DCArtboard id="you-profile" label="You · Profile" width={390} height={844}>
            <Phone label="You · Profile"><window.St_You/></Phone>
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

</body>
</html>
