category: layout_widgets
summary: Layout widgets extracted from pageHeader, dashboardGrid, panel, toolbar, splitPane, tabs, filterBar, and searchBox
  branches.
widgets:
- name: PageHeader
  current_source: case "pageHeader" in renderAdminNode
  classification:
    level: organism
  props: |-
    export interface PageHeaderProps extends CommonWidgetProps {
      breadcrumbs?: string[];
      title: string;
      description?: string;
      primaryActions?: ActionViewModel[];
      onPrimaryAction?: PageActionHandler;
    }
  action_slots:
  - name: primaryActions
    context: page
  usage_example: |-
    <PageHeader
      breadcrumbs={["Admin DSL", "Workbench v2"]}
      title="Request Triage"
      description="Review customer intake requests."
      primaryActions={[newServiceAction]}
      onPrimaryAction={handlePageAction}
    />
  storybook_stories:
  - Default
  - WithBreadcrumbs
  - WithPrimaryAction
  - LongTitleMobile
  - NoDescription
  file_layout: |-
    web/src/admin-dsl/widgets/organisms/PageHeader/
      PageHeader.tsx
      PageHeader.types.ts
      PageHeader.stories.tsx
      PageHeader.test.tsx
      index.ts
- name: DashboardGrid
