- id: admin.surface.overlay-surface
  name: OverlaySurface
  status: scaffolded
  classification:
    level: organism
    description: OverlaySurface participates in the Admin DSL component system as a organism; its level controls scaffold
      location and Storybook grouping.
  source_mapping:
    current_constructs:
    - shared branch for modal, drawer, sheet, detailPanel, inlinePanel
    current_files:
    - path: web/src/admin-dsl/render.tsx
      notes: Current renderer source to inspect for this construct.
  intent:
    purpose: OverlaySurface widget.
    design_rationale: OverlaySurface extracts a named React boundary from the old Admin DSL renderer so behavior, stories,
      styling, and action context can be reviewed independently.
    adapter_boundary: The Admin DSL adapter should convert raw node props/actions into typed OverlaySurface props. OverlaySurface
      should not parse AdminNode JSON or call backend dispatch helpers directly.
    implementation_notes:
    - Implement OverlaySurface using design tokens and typed props from this IR.
    - Keep transport/adapter compatibility outside the visual component.
    accessibility_notes:
    - Ensure OverlaySurface exposes semantic roles, labels, focus behavior, and keyboard interaction appropriate to its rendered
      controls.
  contract:
    props:
      OverlaySurfaceProps:
        doc: Props for OverlaySurface. These are normalized widget props produced by adapters or callers, not raw Admin DSL
          JSON.
        fields:
          surfaceId:
            type: string
            required: true
            doc: 'surfaceId configures overlay surface. Type: string.'
          kind:
            type: OverlaySurfaceKind
            required: true
            doc: 'kind configures overlay surface. Type: OverlaySurfaceKind.'
          title:
            type: string
            required: true
            doc: Primary heading or title rendered by OverlaySurface.
          open:
            type: boolean
            required: false
            doc: 'open configures overlay surface. Type: boolean.'
          children:
            type: React.ReactNode
            required: true
            doc: Already-rendered child content owned by the caller/adapter and placed inside OverlaySurface.
          closeAction:
            type: ActionViewModel
            required: false
            doc: 'closeAction configures overlay surface. Type: ActionViewModel.'
          footerActions:
            type: ActionViewModel[]
            required: false
            doc: Panel-local actions rendered in the footer area of OverlaySurface.
          onCloseAction:
            type: '(action: ActionViewModel, context: { surfaceId: string; kind: OverlaySurfaceKind }) => void'
            required: false
            doc: 'onCloseAction configures overlay surface. Type: (action: ActionViewModel, context: { surfaceId: string;
              kind: OverlaySurfaceKind }) => void.'
          onFooterAction:
            type: '(action: ActionViewModel, context: { surfaceId: string; kind: OverlaySurfaceKind }) => void'
            required: false
            doc: 'onFooterAction configures overlay surface. Type: (action: ActionViewModel, context: { surfaceId: string;
              kind: OverlaySurfaceKind }) => void.'
        extends: CommonWidgetProps
    action_slots:
      close:
        doc: close action slot for OverlaySurface. The widget emits the declared context through onAction and adapters lower
          it to runtime dispatch.
        callback: onAction
        action_type: ActionViewModel
        cardinality: many
        context_type: CloseContext
        context:
          value:
            type: unknown
            required: false
            doc: Optional contextual payload for the close slot on OverlaySurface.
        lowering:
          adapter: dispatchAdminAction
          note: Adapter lowers this typed callback into Admin DSL dispatch.
      footer:
        doc: footer action slot for OverlaySurface. The widget emits the declared context through onAction and adapters lower
          it to runtime dispatch.
        callback: onAction
        action_type: ActionViewModel
        cardinality: many
        context_type: FooterContext
        context:
          value:
            type: unknown
            required: false
            doc: Optional contextual payload for the footer slot on OverlaySurface.
        lowering:
          adapter: dispatchAdminAction
          note: Adapter lowers this typed callback into Admin DSL dispatch.
  examples:
    BasicUsage:
      doc: Demonstrates the normalized props expected by OverlaySurface. Use this as a scaffold for real stories and implementation
        tests.
      demonstrates:
      - Typed OverlaySurface props after adapter lowering.
      - Widget-level usage without raw Admin DSL parsing.
      code: <OverlaySurface />
  stories:
    Modal:
      doc: Tests the Modal scenario for OverlaySurface with representative fixtures and assertions.
      viewport: desktop
      fixtures:
        scenario: modal
      asserts:
      - OverlaySurface renders the Modal scenario without layout breakage.
      - The relevant semantic state is visible to users and test selectors.
