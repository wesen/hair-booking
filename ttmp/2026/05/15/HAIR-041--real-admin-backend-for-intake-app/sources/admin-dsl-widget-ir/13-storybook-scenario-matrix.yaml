widget_story_requirements:
  default: Baseline production-like data.
  empty_or_no_data: Required when the widget can render an empty state.
  actions: Required when the widget exposes action slots.
  lifecycle: Required when the widget has loading, pending, dirty, saved, or error state.
  error: Required when the widget can display validation or runtime errors.
  mobile: Required when layout changes at mobile breakpoints or touch targets matter.
  long_content: Required when text wrapping or overflow is important.
  dispatch_context: Required when the widget emits contextual callbacks.

