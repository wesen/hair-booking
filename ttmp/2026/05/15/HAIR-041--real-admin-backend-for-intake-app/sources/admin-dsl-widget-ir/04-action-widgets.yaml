- id: admin.action.overflow-action-button
  name: OverflowActionButton
  status: scaffolded
  classification:
    level: atom
    description: OverflowActionButton participates in the Admin DSL component system as an atom; its level controls scaffold
      location and Storybook grouping.
  source_mapping:
    current_constructs:
    - renderTableCell branch for kind === "overflowActions"
    current_files:
    - path: web/src/admin-dsl/render.tsx
      notes: Current renderer source to inspect for this construct.
  intent:
    purpose: Render the ellipsis affordance for row overflow menus. First implementation can dispatch the first action, matching
      current behavior. Later implementation can open a real menu.
    design_rationale: Represents row overflow affordance as a named atom so the current ellipsis behavior can later grow into
      a real menu without changing ResourceTable cell contracts.
    adapter_boundary: The table cell passes row context and available actions. The widget should not fetch row actions from
      raw row JSON.
    implementation_notes:
    - Implement OverflowActionButton using design tokens and typed props from this IR.
    - Keep transport/adapter compatibility outside the visual component.
    accessibility_notes:
    - Ensure OverflowActionButton exposes semantic roles, labels, focus behavior, and keyboard interaction appropriate to
      its rendered controls.
  contract:
    props:
      OverflowActionButtonProps:
        doc: Props for OverflowActionButton. These are normalized widget props produced by adapters or callers, not raw Admin
          DSL JSON.
        fields:
          label:
            type: string
            required: false
            doc: Human-readable label rendered by OverflowActionButton.
          actions:
            type: ActionViewModel[]
            required: true
            doc: Ordered action list for the OverflowActionButton slot. Presentation should be derived from semantic slot
              and action intent.
          context:
            type: C
            required: true
            doc: Typed contextual payload passed back when OverflowActionButton invokes an action.
          onAction:
            type: '(action: ActionViewModel, context: C) => void'
            required: false
            doc: Callback invoked by OverflowActionButton with action metadata and typed context.
    action_slots:
      overflowActions:
        doc: Overflow actions are row-scoped actions with compact presentation. Initial scaffold can invoke the first action,
          but final implementation should open a menu.
        callback: onAction
        action_type: ActionViewModel
        cardinality: many
        context_type: OverflowactionsContext
        context:
          value:
            type: unknown
            required: false
            doc: Optional contextual payload for the overflowActions slot on OverflowActionButton.
        lowering:
          adapter: dispatchAdminAction
          note: The widget emits typed context through the callback; the Admin DSL adapter lowers it to dispatchAdminAction
            or backend action transport.
  examples:
    BasicUsage:
      doc: Demonstrates the normalized props expected by OverflowActionButton. Use this as a scaffold for real stories and
        implementation tests.
      demonstrates:
      - Typed OverflowActionButton props after adapter lowering.
      - Widget-level usage without raw Admin DSL parsing.
      code: <OverflowActionButton />
  stories:
    SingleOverflowAction:
      doc: Tests the SingleOverflowAction scenario for OverflowActionButton with representative fixtures and assertions.
      viewport: desktop
      fixtures:
        scenario: singleOverflowAction
      asserts:
      - OverflowActionButton renders the SingleOverflowAction scenario without layout breakage.
      - The relevant semantic state is visible to users and test selectors.
    NoActionsDisabled:
