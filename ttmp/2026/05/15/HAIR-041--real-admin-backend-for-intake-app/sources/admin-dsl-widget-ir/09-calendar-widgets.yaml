widgets:
- id: admin.calendar.month-calendar
  name: MonthCalendar
  status: promoted
  classification:
    level: organism
    description: MonthCalendar participates in the Admin DSL component system as a organism; its level controls scaffold location
      and Storybook grouping.
  source_mapping:
    current_constructs:
    - case "monthCalendar" and buildMonthCells
    current_files:
    - path: web/src/admin-dsl/render.tsx
      notes: Current renderer source to inspect for this construct.
  intent:
    purpose: MonthCalendar widget.
    design_rationale: MonthCalendar extracts a named React boundary from the old Admin DSL renderer so behavior, stories,
      styling, and action context can be reviewed independently.
    adapter_boundary: The Admin DSL adapter should convert raw node props/actions into typed MonthCalendar props. MonthCalendar
      should not parse AdminNode JSON or call backend dispatch helpers directly.
    implementation_notes:
    - Implement MonthCalendar using design tokens and typed props from this IR.
    - Keep transport/adapter compatibility outside the visual component.
    accessibility_notes:
    - Ensure MonthCalendar exposes semantic roles, labels, focus behavior, and keyboard interaction appropriate to its rendered
      controls.
  contract:
    props:
      MonthCalendarMarker:
        doc: Props for MonthCalendar. These are normalized widget props produced by adapters or callers, not raw Admin DSL
          JSON.
        fields:
          date:
            type: string
            required: true
            doc: 'date configures month calendar. Type: string.'
          kind:
            type: string
            required: true
            doc: 'kind configures month calendar. Type: string.'
          tone:
            type: '"success" | "warning" | "danger" | "neutral"'
            required: false
            doc: Visual tone used for status, emphasis, or border treatment in MonthCalendar.
      MonthCalendarLegendItem:
        doc: Props for MonthCalendar. These are normalized widget props produced by adapters or callers, not raw Admin DSL
          JSON.
        fields:
          kind:
            type: string
            required: true
            doc: 'kind configures month calendar. Type: string.'
          label:
            type: string
            required: true
            doc: Human-readable label rendered by MonthCalendar.
          tone:
            type: '"success" | "warning" | "danger" | "neutral"'
            required: false
            doc: Visual tone used for status, emphasis, or border treatment in MonthCalendar.
      MonthCalendarProps:
        doc: Props for MonthCalendar. These are normalized widget props produced by adapters or callers, not raw Admin DSL
          JSON.
        fields:
          calendarId:
            type: string
            required: true
            doc: 'calendarId configures month calendar. Type: string.'
          month:
            type: string; // YYYY-MM
            required: true
            doc: Month key rendered by MonthCalendar, typically YYYY-MM.
          label:
            type: string
            required: false
            doc: Human-readable label rendered by MonthCalendar.
          selectedDate:
            type: string
            required: false
            doc: Currently selected date rendered by MonthCalendar.
          markers:
            type: MonthCalendarMarker[]
            required: false
            doc: Date markers rendered by MonthCalendar.
          legend:
            type: MonthCalendarLegendItem[]
            required: false
            doc: Legend entries explaining markers rendered by MonthCalendar.
          previousMonthAction:
            type: ActionViewModel
            required: false
            doc: 'previousMonthAction configures month calendar. Type: ActionViewModel.'
          nextMonthAction:
            type: ActionViewModel
            required: false
            doc: 'nextMonthAction configures month calendar. Type: ActionViewModel.'
          selectDateAction:
            type: ActionViewModel
            required: false
            doc: 'selectDateAction configures month calendar. Type: ActionViewModel.'
          onMonthAction:
            type: '(action: ActionViewModel, context: { calendarId: string; month: string; direction: "previous" | "next" }) => void'
            required: false
            doc: Callback invoked by MonthCalendar previous/next controls with calendar id, current month, and direction.
          onSelectDate:
            type: '(action: ActionViewModel, context: { calendarId: string; date: string }) => void'
            required: false
            doc: Callback invoked by MonthCalendar date cells with selected date context.
        extends: CommonWidgetProps
    action_slots:
      previousMonth:
        doc: previousMonth action slot for MonthCalendar. The widget emits the declared context through onAction and adapters
          lower it to runtime dispatch.
        callback: onMonthAction
        action_type: ActionViewModel
        cardinality: many
        context_type: PreviousmonthContext
        context:
          value:
            type: unknown
            required: false
            doc: Optional contextual payload for the previousMonth slot on MonthCalendar.
        lowering:
          adapter: dispatchAdminAction
          note: Adapter lowers this typed callback into Admin DSL dispatch.
      nextMonth:
        doc: nextMonth action slot for MonthCalendar. The widget emits the declared context through onAction and adapters
          lower it to runtime dispatch.
        callback: onMonthAction
        action_type: ActionViewModel
        cardinality: many
        context_type: NextmonthContext
        context:
          value:
            type: unknown
            required: false
            doc: Optional contextual payload for the nextMonth slot on MonthCalendar.
        lowering:
          adapter: dispatchAdminAction
          note: Adapter lowers this typed callback into Admin DSL dispatch.
      selectDate:
        doc: selectDate action slot for MonthCalendar. The widget emits the declared context through onAction and adapters
          lower it to runtime dispatch.
        callback: onSelectDate
        action_type: ActionViewModel
        cardinality: many
        context_type: SelectdateContext
        context:
          value:
            type: unknown
            required: false
            doc: 'Context described in v1 IR as: { calendarId, date }'
        lowering:
          adapter: dispatchAdminAction
          note: Adapter lowers this typed callback into Admin DSL dispatch.
  examples:
    BasicUsage:
      doc: Demonstrates the normalized props expected by MonthCalendar. Use this as a scaffold for real stories and implementation
        tests.
      demonstrates:
      - Typed MonthCalendar props after adapter lowering.
      - Widget-level usage without raw Admin DSL parsing.
      code: <MonthCalendar />
  stories:
    DefaultMonth:
      doc: Tests the normal month grid for MonthCalendar.
      viewport: desktop
      fixtures:
        scenario: defaultMonth
      asserts:
      - MonthCalendar renders the DefaultMonth scenario without layout breakage.
      - The relevant semantic state is visible to users and test selectors.
    WithPublishedMarkers:
      doc: Tests the WithPublishedMarkers scenario for MonthCalendar with representative fixtures and assertions.
      viewport: desktop
      fixtures:
        scenario: withPublishedMarkers
      asserts:
      - MonthCalendar renders the WithPublishedMarkers scenario without layout breakage.
      - The relevant semantic state is visible to users and test selectors.
    WithScheduledMarkers:
      doc: Tests the WithScheduledMarkers scenario for MonthCalendar with representative fixtures and assertions.
      viewport: desktop
      fixtures:
        scenario: withScheduledMarkers
      asserts:
      - MonthCalendar renders the WithScheduledMarkers scenario without layout breakage.
      - The relevant semantic state is visible to users and test selectors.
    SelectedDate:
      doc: Tests selected date styling and callback context in MonthCalendar.
      viewport: desktop
      fixtures:
        scenario: selectedDate
      asserts:
      - MonthCalendar renders the SelectedDate scenario without layout breakage.
      - The relevant semantic state is visible to users and test selectors.
    NoActionsReadonly:
      doc: Tests read-only behavior when MonthCalendar has no actions.
      viewport: desktop
      fixtures:
        scenario: noActionsReadonly
      asserts:
      - MonthCalendar renders the NoActionsReadonly scenario without layout breakage.
      - The relevant semantic state is visible to users and test selectors.
    PreviousNextActions:
      doc: Tests previous/next month action slots in MonthCalendar.
      viewport: desktop
      fixtures:
        scenario: previousNextActions
      asserts:
      - MonthCalendar renders the PreviousNextActions scenario without layout breakage.
      - The relevant semantic state is visible to users and test selectors.
    MobileCalendar:
      doc: Tests mobile calendar layout for MonthCalendar.
      viewport: desktop
      fixtures:
        scenario: mobileCalendar
      asserts:
      - MonthCalendar renders the MobileCalendar scenario without layout breakage.
      - The relevant semantic state is visible to users and test selectors.
  outputs:
    component:
      path: web/src/admin-dsl/widgets/organisms/MonthCalendar/MonthCalendar.tsx
    types:
      path: web/src/admin-dsl/widgets/organisms/MonthCalendar/MonthCalendar.types.ts
    stories:
      path: web/src/admin-dsl/widgets/organisms/MonthCalendar/MonthCalendar.stories.tsx
    barrel:
      path: web/src/admin-dsl/widgets/organisms/MonthCalendar/index.ts
    tests:
      path: web/src/admin-dsl/widgets/organisms/MonthCalendar/MonthCalendar.test.tsx
  implementation_todos:
  - id: replace-generated-scaffold-placeholder-with-final-implementation
    severity: required
    doc: Replace generated scaffold placeholder with final implementation.
