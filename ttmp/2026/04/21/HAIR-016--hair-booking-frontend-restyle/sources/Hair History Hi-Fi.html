<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Hair History — Hi-Fi Versions</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Anton&family=Oswald:wght@400;600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
  html, body { margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
  * { box-sizing: border-box; }
</style>
</head>
<body>

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="history-hifi.jsx"></script>

<script type="text/babel">
  const PHONE_W = 390, PHONE_H = 844;

  function PhoneFrame({ children }) {
    return (
      <div style={{
        width: PHONE_W, height: PHONE_H,
        borderRadius: 48, overflow: 'hidden',
        border: '8px solid #1a1a1a',
        boxShadow: '0 30px 60px rgba(0,0,0,0.18)',
        background: '#fff',
        position: 'relative',
      }}>
        {/* dynamic island */}
        <div style={{
          position: 'absolute', top: 12, left: '50%', transform: 'translateX(-50%)',
          width: 110, height: 32, borderRadius: 20, background: '#000', zIndex: 100,
        }}/>
        {children}
      </div>
    );
  }

  function App() {
    return (
      <DesignCanvas>
        <DCSection id="history" title="05 — Hair History · Original Directions"
          subtitle="Editorial · Minimal · Magazine">
          <DCArtboard id="luxe" label="A · Luxe Editorial" width={PHONE_W} height={PHONE_H}>
            <PhoneFrame><History_Luxe/></PhoneFrame>
          </DCArtboard>
          <DCArtboard id="minimal" label="B · Modern Minimal" width={PHONE_W} height={PHONE_H}>
            <PhoneFrame><History_Minimal/></PhoneFrame>
          </DCArtboard>
          <DCArtboard id="magazine" label="C · Magazine / Print" width={PHONE_W} height={PHONE_H}>
            <PhoneFrame><History_Magazine/></PhoneFrame>
          </DCArtboard>
        </DCSection>

        <DCSection id="zine-refined" title="05 — Zine, Refined"
          subtitle="Keeping the bold black masthead but dropping the xerox. Three color directions.">
          <DCArtboard id="editorial-zine" label="D · Editorial Zine — Coral + Butter" width={PHONE_W} height={PHONE_H}>
            <PhoneFrame><History_EditorialZine/></PhoneFrame>
          </DCArtboard>
          <DCArtboard id="quiet-zine" label="E · Quiet Zine — Ochre + Sage + Blush" width={PHONE_W} height={PHONE_H}>
            <PhoneFrame><History_QuietZine/></PhoneFrame>
          </DCArtboard>
          <DCArtboard id="modern-zine" label="F · Modern Zine — Plum + Peach" width={PHONE_W} height={PHONE_H}>
            <PhoneFrame><History_ModernZine/></PhoneFrame>
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

</body>
</html>
