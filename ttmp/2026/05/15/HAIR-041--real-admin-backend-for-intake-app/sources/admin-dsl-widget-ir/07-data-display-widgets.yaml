    props:
      MetricCardProps:
        doc: Props for MetricCard. These are normalized widget props produced by adapters or callers, not raw Admin DSL JSON.
        fields:
          label:
            type: string
            required: true
            doc: Human-readable label rendered by MetricCard.
          value:
            type: string | number
            required: true
            doc: Current value or active selection rendered by MetricCard.
          caption:
            type: string
            required: false
            doc: 'caption configures metric card. Type: string.'
          tone:
            type: '"neutral" | "success" | "warning" | "danger" | string'
            required: false
            doc: Semantic tone used for MetricCard value emphasis and top accent styling.
        extends: CommonWidgetProps
    action_slots: {}
  examples:
